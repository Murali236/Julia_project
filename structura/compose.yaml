services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MAX_CONCURRENT_JOBS: 2
      ANALYSIS_TIMEOUT_SECONDS: 45
    init: true
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped
